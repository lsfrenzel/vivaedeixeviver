{% extends "base.html" %}

{% block title %}Login - Diário do Contador{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-book-half text-primary" style="font-size: 3rem;"></i>
                        <h1 class="h3 mt-3 fw-semibold">Diário do Contador</h1>
                        <p class="text-muted">Associação Viva e Deixe Viver</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">E-mail</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="senha" class="form-label fw-medium">Senha</label>
                            <input type="password" class="form-control form-control-lg" id="senha" name="senha" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
                            Entrar
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3 text-muted small">
                <p>Use: voluntario@teste.com / senha123</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
