{% extends "base.html" %}

{% block title %}Criar Usuário - Diário do Contador{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-4">
                <a href="{{ url_for('admin_usuarios') }}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h3 fw-semibold mb-0">
                    <i class="bi bi-person-plus-fill text-primary"></i> Criar Novo Usuário
                </h1>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome Completo *</label>
                            <input type="text" class="form-control form-control-lg" id="nome" name="nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">E-mail *</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-semibold">Senha *</label>
                            <input type="password" class="form-control form-control-lg" id="senha" name="senha" required>
                        </div>

                        <div class="mb-3">
                            <label for="estado_padrao" class="form-label fw-semibold">Estado Padrão</label>
                            <select class="form-select form-select-lg" id="estado_padrao" name="estado_padrao">
                                <option value="">Selecione um estado</option>
                                {% for estado in estados %}
                                <option value="{{ estado }}">{{ estado }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="hospital_padrao_id" class="form-label fw-semibold">Hospital Padrão</label>
                            <select class="form-select form-select-lg" id="hospital_padrao_id" name="hospital_padrao_id">
                                <option value="">Selecione um hospital</option>
                                {% for hospital in hospitais %}
                                <option value="{{ hospital.id }}">{{ hospital.nome }} ({{ hospital.estado }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_admin" name="is_admin">
                                <label class="form-check-label fw-semibold" for="is_admin">
                                    Conceder privilégios de administrador
                                </label>
                            </div>
                            <small class="text-muted">Administradores têm acesso completo ao sistema, incluindo gerenciamento de usuários.</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> Criar Usuário
                            </button>
                            <a href="{{ url_for('admin_usuarios') }}" class="btn btn-outline-secondary btn-lg">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
